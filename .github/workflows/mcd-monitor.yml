
name: MCD Signal Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mcd-signal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

            - name: Test ntfy notification
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: https://ntfy.sh
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "ERROR: NTFY_TOPIC secret is missing"
            exit 1
          fi
          curl --fail --show-error --silent \
            -H "Title: MCD Signal AI - Ujian Pelayan" \
            -H "Priority: default" \
            -H "Tags: white_check_mark" \
            -d "Ujian ntfy dari GitHub Actions berjaya. Ini bukan signal BUY/SELL." \
            "$NTFY_SERVER/$NTFY_TOPIC"

      - name: Check market and signal
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: https://ntfy.sh
        run: python scripts/mcd_monitor.py

      - name: Check market and signal
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: https://ntfy.sh
        run: python scripts/mcd_monitor.py

      - name: Save signal state
        run: |
          if [ -n "$(git status --porcelain .mcd_signal_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .mcd_signal_state.json
            git commit -m "Update MCD signal monitor state"
            git push
          fi
