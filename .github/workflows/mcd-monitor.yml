
name: MCD Signal Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: mcd-signal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: MCD V3.1 Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clean Python bytecode
        shell: bash
        run: |
          set -euo pipefail

          find . -type d -name "__pycache__" \
            -prune -exec rm -rf {} +

          find . -type f \( \
            -name "*.pyc" -o \
            -name "*.pyo" \
          \) -delete

          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          *$py.class
          .venv/
          venv/
          env/
          .pytest_cache/
          .coverage
          htmlcov/
          *.tmp
          *.log
          EOF

      - name: Check required files
        run: |
          set -euo pipefail
          test -f mcd_monitor.py
          test -f index.html
          test -f .gitignore

      - name: Python syntax check
        run: python -m py_compile mcd_monitor.py

      - name: Run unit tests
        run: |
          python -m unittest discover \
            -s . \
            -p 'test_mcd_monitor.py' \
            -v

      - name: Run MCD monitor
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_DATA_SYMBOL: XAU/USD
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: https://ntfy.sh
          PYTHONUNBUFFERED: "1"
        run: python mcd_monitor.py

      - name: Validate signal JSON
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path("signal_status.json")
          if not path.exists():
              raise SystemExit("signal_status.json missing")

          data = json.loads(path.read_text(encoding="utf-8"))

          required = [
              "signal",
              "score",
              "data_status",
              "indicators",
              "active_setups",
              "signal_history",
              "performance",
              "news_impact",
          ]

          missing = [k for k in required if k not in data]
          if missing:
              raise SystemExit("Missing JSON fields: " + str(missing))

          if data["signal"] not in ("BUY", "SELL", "WAIT"):
              raise SystemExit("Invalid signal")

          if not isinstance(data["active_setups"], list):
              raise SystemExit("active_setups must be a list")

          if not isinstance(data["signal_history"], list):
              raise SystemExit("signal_history must be a list")

          if data["signal"] in ("BUY", "SELL"):
              for key in ("entry", "sl", "tp1"):
                  if data.get(key) is None:
                      raise SystemExit(f"Missing {key}")

          if "tp2" in data or "tp3" in data:
              raise SystemExit("Only one TP is permitted")

          def check_finite(obj):
              if isinstance(obj, float) and not math.isfinite(obj):
                  raise ValueError("Invalid numeric value")
              if isinstance(obj, dict):
                  for value in obj.values():
                      check_finite(value)
              elif isinstance(obj, list):
                  for value in obj:
                      check_finite(value)

          check_finite(data)

          print("JSON validation passed")
          print("Signal:", data["signal"])
          print("Score:", data["score"], "/10")
          print("Active setups:", len(data["active_setups"]))
          print("History records:", len(data["signal_history"]))
          PY

      - name: Validate dashboard JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.external = False
                  self.current = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.inside = True
                      self.external = bool(dict(attrs).get("src"))
                      self.current = []

              def handle_data(self, data):
                  if self.inside and not self.external:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self.inside:
                      if not self.external:
                          self.scripts.append("".join(self.current))
                      self.inside = False

          parser = ScriptParser()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))

          scripts = [s for s in parser.scripts if s.strip()]
          if not scripts:
              raise SystemExit("No inline JavaScript found")

          Path("/tmp/mcd.js").write_text(
              "\n;\n".join(scripts), encoding="utf-8"
          )
          PY

          node --check /tmp/mcd.js

      - name: Remove tracked bytecode
        run: |
          git rm -r --cached --ignore-unmatch __pycache__ || true
          git rm --cached --ignore-unmatch "*.pyc" || true
          git rm --cached --ignore-unmatch "*.pyo" || true

      - name: Commit generated data and cleanup
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update MCD V3.1 monitor data"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
