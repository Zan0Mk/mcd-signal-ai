
name: MCD Signal Monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedule: setiap 5 minit
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: mcd-signal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Update XAUUSD M5 signal and calendar
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f scripts/mcd_monitor.py
          test -f tests/test_mcd_monitor.py
          echo "Required files found."

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            scripts/mcd_monitor.py \
            tests/test_mcd_monitor.py

      - name: Test strategy contract
        run: python -m unittest discover -s tests -v

      - name: Validate dashboard JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.external = False
                  self.parts = []
                  self.items = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.active = True
                      self.external = bool(dict(attrs).get("src"))
                      self.parts = []

              def handle_data(self, data):
                  if self.active and not self.external:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.active:
                      if not self.external:
                          self.items.append("".join(self.parts))
                      self.active = False
                      self.external = False
                      self.parts = []

          parser = Scripts()
          parser.feed(
              Path("index.html").read_text(encoding="utf-8")
          )

          inline = [item for item in parser.items if item.strip()]
          if not inline:
              raise SystemExit("No inline JavaScript found")

          Path("/tmp/mcd-dashboard.js").write_text(
              "\n;\n".join(inline),
              encoding="utf-8",
          )

          print(f"Found {len(inline)} inline script block(s).")
          PY

          node --check /tmp/mcd-dashboard.js

      - name: Run MCD monitor
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_DATA_SYMBOL: XAU/USD
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: https://ntfy.sh
          PYTHONUNBUFFERED: "1"
        run: python scripts/mcd_monitor.py

      - name: Validate generated JSON contract
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path("signal_status.json")

          if not path.is_file():
              raise SystemExit(
                  "signal_status.json was not generated"
              )

          data = json.loads(path.read_text(encoding="utf-8"))

          if not isinstance(data, dict):
              raise SystemExit("JSON root must be an object")

          required = [
              "version",
              "symbol",
              "timeframe",
              "updated_utc",
              "data_status",
              "signal",
              "entry",
              "sl",
              "tp1",
              "chart_candles",
              "trend",
              "techniques",
              "economic_calendar",
              "performance",
          ]

          missing = [key for key in required if key not in data]
          if missing:
              raise SystemExit(
                  "Missing dashboard fields: " + ", ".join(missing)
              )

          if data["signal"] not in {"BUY", "SELL", "WAIT"}:
              raise SystemExit("Invalid signal enum")

          if data.get("tp2") is not None or data.get("tp3") is not None:
              raise SystemExit(
                  "Single-target contract violation: "
                  "tp2/tp3 must not be emitted"
              )

          if not isinstance(data["chart_candles"], list):
              raise SystemExit("chart_candles must be a list")

          calendar = data["economic_calendar"]
          if (
              not isinstance(calendar, dict)
              or not isinstance(calendar.get("events"), list)
          ):
              raise SystemExit("economic_calendar schema invalid")

          def finite(value, path="$"):
              if isinstance(value, float) and not math.isfinite(value):
                  raise ValueError(f"Non-finite value at {path}")

              if isinstance(value, dict):
                  for key, item in value.items():
                      finite(item, f"{path}.{key}")

              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      finite(item, f"{path}[{index}]")

          finite(data)

          state_path = Path(".mcd_signal_state.json")
          if state_path.exists():
              state = json.loads(
                  state_path.read_text(encoding="utf-8")
              )
              if not isinstance(state, dict):
                  raise SystemExit("State JSON root must be object")

          print(
              "JSON contract passed:",
              data["signal"],
              data["data_status"],
              "calendar",
              calendar.get("status"),
          )
          PY

      - name: Commit generated data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add signal_status.json .mcd_signal_state.json

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "chore: update MCD signal and calendar data"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Failure diagnostics
        if: failure()
        run: |
          echo "MCD monitor workflow failed."
          echo "Inspect the failed step logs."
          echo "Check TWELVE_DATA_API_KEY, NTFY_TOPIC,"
          echo "file paths, API quotas and repository permissions."
