
name: MCD Signal Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: mcd-signal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Update XAUUSD M5 signal and calendar
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify repository files
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f mcd_monitor.py

          echo "index.html found."
          echo "mcd_monitor.py found at repository root."

      - name: Validate Python syntax
        run: python -m py_compile mcd_monitor.py

      - name: Run tests if source tests exist
        shell: bash
        run: |
          set -euo pipefail

          if [ -d tests ] && find tests -maxdepth 1 -name 'test*.py' -print -quit | grep -q .; then
            python -m unittest discover -s tests -p 'test*.py' -v
          elif find . -maxdepth 1 -name 'test*.py' -print -quit | grep -q .; then
            python -m unittest discover -s . -p 'test*.py' -v
          else
            echo "No Python test source files found; skipping optional tests."
          fi

      - name: Validate dashboard JavaScript
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.external = False
                  self.parts = []
                  self.items = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.active = True
                      self.external = bool(dict(attrs).get("src"))
                      self.parts = []

              def handle_data(self, data):
                  if self.active and not self.external:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.active:
                      if not self.external:
                          self.items.append("".join(self.parts))
                      self.active = False
                      self.external = False
                      self.parts = []

          parser = Scripts()
          parser.feed(
              Path("index.html").read_text(encoding="utf-8")
          )

          scripts = [s for s in parser.items if s.strip()]
          if not scripts:
              raise SystemExit("No inline JavaScript found")

          Path("/tmp/mcd-dashboard.js").write_text(
              "\n;\n".join(scripts),
              encoding="utf-8",
          )

          print(f"Found {len(scripts)} inline script block(s).")
          PY

          node --check /tmp/mcd-dashboard.js

      - name: Run MCD monitor
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_DATA_SYMBOL: XAU/USD
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: https://ntfy.sh
          PYTHONUNBUFFERED: "1"
        run: python mcd_monitor.py

      - name: Validate generated signal JSON
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path("signal_status.json")
          if not path.is_file():
              raise SystemExit(
                  "signal_status.json was not generated"
              )

          data = json.loads(path.read_text(encoding="utf-8"))

          if not isinstance(data, dict):
              raise SystemExit("JSON root must be an object")

          required = [
              "version",
              "symbol",
              "timeframe",
              "updated_utc",
              "data_status",
              "signal",
              "entry",
              "sl",
              "tp1",
              "chart_candles",
              "trend",
              "techniques",
              "economic_calendar",
              "performance",
          ]

          missing = [key for key in required if key not in data]
          if missing:
              raise SystemExit(
                  "Missing fields: " + ", ".join(missing)
              )

          if data["signal"] not in {"BUY", "SELL", "WAIT"}:
              raise SystemExit("Invalid signal")

          if data.get("tp2") is not None or data.get("tp3") is not None:
              raise SystemExit("Only one TP is permitted")

          if not isinstance(data["chart_candles"], list):
              raise SystemExit("chart_candles must be a list")

          calendar = data["economic_calendar"]
          if not isinstance(calendar, dict):
              raise SystemExit(
                  "economic_calendar must be an object"
              )

          if not isinstance(calendar.get("events"), list):
              raise SystemExit(
                  "economic_calendar.events must be a list"
              )

          def check_finite(value, location="$"):
              if isinstance(value, float) and not math.isfinite(value):
                  raise ValueError(
                      f"Invalid number at {location}"
                  )

              if isinstance(value, dict):
                  for key, item in value.items():
                      check_finite(item, f"{location}.{key}")

              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      check_finite(item, f"{location}[{index}]")

          check_finite(data)

          state_path = Path(".mcd_signal_state.json")
          if state_path.exists():
              state = json.loads(
                  state_path.read_text(encoding="utf-8")
              )
              if not isinstance(state, dict):
                  raise SystemExit(
                      "State JSON must be an object"
                  )

          print("Signal:", data["signal"])
          print("Data status:", data["data_status"])
          print(
              "Calendar status:",
              calendar.get("status"),
          )
          print(
              "Calendar events:",
              len(calendar["events"]),
          )
          PY

      - name: Commit generated data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add signal_status.json .mcd_signal_state.json

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "chore: update MCD signal and calendar data"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "MCD monitor workflow failed."
          echo "Check the failed step logs."
          echo "Confirm TWELVE_DATA_API_KEY and NTFY_TOPIC."
          echo "Check API availability and repository permissions."
